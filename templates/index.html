<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <!-- Bootstrap CSS for styling-->
    <link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel = "stylesheet" href ="{{url_for('static', filename='css/style.css')}}">
</head>
<body class="bg-light">

    <div class="container-fluid py-4">
        <!--Header-->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0 fw-bold">Kanban Board</h1>
            <button class="btn btn-primary"  data-bs-toggle="modal" data-bs-target="#addTaskModal">
                + Add Task
            </button>
        </div>

        <!--Kanban Columns Container-->
        <div class = "row g-3">
            <!--TO do column-->
            <div class="col-md-4">
                <div class="card bg-white shadow-sm h-100">
                    <div class="card-header bg-secondary text-white fw-bold">
                        To Do (<span id="todo-count">0</span>)
                    </div>
                    <div class="card-body kanban-column" id="todo" data-id = "1" data-status="todo">
                        <!--JS Magic-->
                    </div>
                </div>
            </div>



            <!--In progress-->
            <div class = "col-md-4">
                <div class="card bg-white shadow-sm h-100">
                    <div class="card-header bg-primary text-white fw-bold">
                        In Progress (<span id = "in-progress-count">0</span>)
                    </div>
                    <div class="card-body kanban-column" id = "in-progress" data-id = "2" data-status="in-progress">
                        <!--Task will load dynamically via JS-->
                    </div>
                </div>
            </div>




            <!--Done Column-->
            <div class ="col-md-4">
                <div class = "card bg-white shadow-sm h-100">
                    <div class="card-header bg-success text-white fw-bold">
                        Done (<span id="done-count">0</span>)
                    </div>
                    <div class="card-body kanban-column" id="done" data-id = "3" data-status="done">
                        <!--Task cards will load dynamically vie JS-->
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!--Modal for Adding New Tasks-->
    <div class = "modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addModalLabel">Create New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="addTaskForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="taskTitle" class="form-label">Title</label>
                            <input type="text" class="form-control" id="taskTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="taskDesc" class="form-label">Description</label>
                            <textarea class="form-control" id="taskDesc" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{url_for('static', filename='js/script.js')}}"></script>
</body>
</html>
